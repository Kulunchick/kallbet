<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 80" role="img" aria-label="KallBET">
  <!-- PLACEHOLDER wordmark in the KallBET emerald/gold style. Replace this
       file with the real logo (keep the name, or update components/Logo.tsx). -->
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- emblem: a K cut into an emerald-edged tile -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="#0c1011" stroke="url(#emerald)" stroke-width="2.5" filter="url(#glow)"/>
  <g transform="translate(-5 0)">
    <path d="M27 22h9v36h-9z" fill="url(#emerald)"/>
    <path d="M38 40 52 22h11L48.5 40 63 58H52z" fill="url(#gold)"/>
  </g>

  <!-- wordmark -->
  <g font-family="Unbounded, 'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
    <text x="90" y="54" fill="#e9f1ee">Kall<tspan fill="url(#gold)">BET</tspan></text>
  </g>
</svg>
