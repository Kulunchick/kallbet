[project]
name = "kbml"
version = "0.1.0"
description = "KallBet ML prototype: can a learned model pick more CS2 Match winners than the Signal Lab anchor?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "pytest",
    "lxml>=6.1.3",
    "cssselect>=1.6.0",
]

# torch comes from one of two conflicting groups: `cpu` (default) or `gpu`, the CUDA 13.2 build of
# the same version, for kbml.swiss_gpu: `uv sync --no-default-groups --group gpu`.
[dependency-groups]
cpu = ["torch"]
gpu = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu132", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
package = false
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
