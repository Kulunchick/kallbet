# Production stack. The deploy script ships this file next to `kallbet.env`
# (the server's env file with BOT_TOKEN, BOT_USERNAME, PANDASCORE_TOKEN; never committed).
# See docs/deploy.md.

services:
  kallbet:
    image: kallbet:latest
    restart: unless-stopped
    env_file: kallbet.env
    # Bounded container logs: the server is short on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Fixed here so that the env file cannot get these wrong.
      KALLBET_BIND: 0.0.0.0:8095
      DATABASE_URL: sqlite:///data/kallbet.db
      KALLBET_DEV_LOGIN: "false"
      # Where the HLTV adapter (ticket #8) finds Chrome.
      KALLBET_CHROME_URL: http://chrome:9222
      # Downloaded team logos, on the data volume (ticket #8).
      KALLBET_LOGO_DIR: /data/logos
    ports:
      # Host loopback only: Caddy is the sole way in from outside.
      - "127.0.0.1:8095:8095"
    volumes:
      - kallbet-data:/data
    depends_on:
      - chrome
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8095/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]

  chrome:
    # Headless Chrome with the DevTools port on 9222. No `ports:`; only the
    # app, on the `internal` network, can reach it.
    image: chromedp/headless-shell:stable
    restart: unless-stopped
    init: true
    # Bounded container logs: the server is short on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: 256m
    mem_limit: 768m
    networks: [internal]

  # Optional AI sidecar (spec #21, docs/sidecar.md). Off unless the `sidecar`
  # profile is requested: `docker compose --profile sidecar up -d`. Plain
  # `docker compose up -d` starts only kallbet and chrome, as before.
  sidecar:
    profiles: ["sidecar"]
    image: kallbet-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.sidecar
      # `sidecar` (binary only) or `sidecar-cli` (adds the claude and codex CLIs).
      target: ${KALLBET_AI_TARGET:-sidecar}
    restart: unless-stopped
    # Reaps the CLI subprocesses and forwards the stop signal.
    init: true
    # KALLBET_BOT_SECRET (the same value as in kallbet.env), ODDSPAPI_API_KEY, ...
    env_file: sidecar.env
    environment:
      # Fixed here so that the env file cannot get these wrong.
      SIDECAR_CONFIG: /config/sidecar.json
      HOME: /data/home
    volumes:
      # SQLite audit file and the CLI sign-in (home/).
      - sidecar-data:/data
      # Valve snapshots, filled by deploy/sidecar/fetch-vrs.sh (read at start-up).
      - ./vrs:/data/vrs:ro
      - ./sidecar.json:/config/sidecar.json:ro
    depends_on:
      kallbet:
        condition: service_healthy
    # A tick is dropped on SIGTERM at once; this is only slack for the audit write.
    stop_grace_period: 30s
    mem_limit: 512m
    # Bounded container logs: the server is short on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]

volumes:
  kallbet-data:
  sidecar-data:

networks:
  internal:
