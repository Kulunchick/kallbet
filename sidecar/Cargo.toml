[package]
name = "kallbet-ai"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Optional iOS TLS/HTTP2 impersonation transport for ticket #36's offline HLTV
# research collector. Never enabled in default or production Docker builds.
hltv-impersonate = ["dep:wreq", "dep:wreq-util"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
dotenvy = "0.15.7"
flate2 = "1.1.11"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
wreq = { version = "6.0.0-rc.31", optional = true, features = ["gzip", "brotli", "deflate"] }
wreq-util = { version = "3.0.0-rc.14", optional = true, features = ["emulation"] }

[dev-dependencies]
kallbet = { path = ".." }
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
