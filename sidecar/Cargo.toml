[package]
name = "kallbet-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }

[dev-dependencies]
kallbet = { path = ".." }
axum = "0.8.9"
tempfile = "3.27.0"
